<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hra v lese — Chalupa</title>
  <meta name="description" content="Digitální mapa tras Hry v lese u Heřmanic / Hřídelce (WhatsApp Chalupa).">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="styles.css?v=13">
</head>
<body>
  <div id="banner" class="banner" role="status"></div>
  <header class="app-bar">
    <div>
      <h1>Hra v lese</h1>
      <p class="sub">Chalupa · Heřmanice / Hřídelec / Pustá Proseč · mřížka A–U × 1–17</p>
    </div>
    <div class="controls">
      <button type="button" id="btn-fit">Celá mřížka</button>
      <button type="button" id="btn-all">Všichni</button>
      <button type="button" id="btn-none">Nikdo</button>
      <button type="button" id="btn-play">Přehrát</button>
    </div>
  </header>
  <main>
    <div id="map" aria-label="Mapa tras"></div>
    <p class="map-scroll-hint">Mapa: zoom tlačítky +/−. Celou stránku (včetně mapy) scrolluj jedním prstem.</p>
    <aside class="panel" aria-label="Časová osa a hráči">
      <div class="panel-toolbar">
        <label class="scrubber" for="scrubber">
          <span class="scrubber-title">Pozice v čase</span>
          <input type="range" id="scrubber" min="0" max="0" value="0" step="1" aria-valuetext="">
          <span id="scrubber-meta" class="scrubber-meta">—</span>
        </label>
      </div>
      <div class="panel-body">
        <h2>Hráči</h2>
        <div id="legend"></div>
        <h2>Dvojice</h2>
        <div id="pairs"></div>
        <div id="uncertain" class="uncertain"></div>
        <p class="muted footnote">Podklad: OpenTopoMap (dočasně). Preferovaný turistický podklad Mapy.cz — viz README.</p>
      </div>
    </aside>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="config.js?v=13"></script>
  <script src="data.js?v=13"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
